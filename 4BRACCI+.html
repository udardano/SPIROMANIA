<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Tracciatore a 4 Vettori Complessi</title>
    <style>
        body { background-color: #111; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        canvas { border: 1px solid #444; background-color: #000; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .controls { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        button { background: #333; color: white; border: 1px solid #555; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; margin: 0 5px; }
        button:hover { background: #444; }
        .checkbox-container { margin: 5px 0; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .checkbox-container input { width: 18px; height: 18px; cursor: pointer; }
        .sliders { background: #222; padding: 15px; border-radius: 8px; width: 480px; }
        .group { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; gap: 10px; }
        .group label { text-align: left; flex-grow: 1; font-size: 13px; }
        .group input[type="range"] { flex-grow: 2; max-width: 170px; }
        .group input[type="text"] { 
            background: #333; color: #00ffcc; border: 1px solid #555; 
            padding: 4px; border-radius: 4px; width: 60px; text-align: center; 
            font-weight: bold; font-size: 13px;
        }
        .group input[type="text"]:focus { border-color: #00ffcc; outline: none; }
        .group span.static-val { color: #00ffcc; font-weight: bold; min-width: 45px; text-align: right; font-size: 14px; }
        .divider { border-top: 1px solid #444; padding-top: 8px; margin-top: 8px; }
        .formula { font-style: italic; font-family: 'Times New Roman', Times, serif; color: #00ffcc; margin-bottom: 15px; font-size: 1.2em; }
    </style>
</head>
<body>

    <h2>TRACCIATORE EPICICLICO A 4 VETTORI</h2>
    <div class="formula">z(t) = A·e<sup>i·t</sup> + B·e<sup>i·b·t</sup> + C·e<sup>i·c·t</sup> + D·e<sup>i·d·t</sup></div>

    <canvas id="spiroCanvas" width="680" height="400"></canvas>
    
    <div class="controls">
        <div>
            <button id="btnPause" onclick="togglePause()">Pausa</button>
            <button onclick="restartAnimation()">Riavvia</button>
            <button onclick="randomParam()">Forma Casuale</button>
        </div>

        <label class="checkbox-container">
            <input type="checkbox" id="checkShowGeometry" checked onchange="updateView()">
            Mostra Vettori e Cerchi Guida
        </label>

        <div class="sliders">
            <!-- Lunghezze dei quattro bracci -->
            <div class="group">
                <label style="color: #00ffcc;">Braccio A (Freq = 1):</label>
                <input type="range" id="rangeA" min="0" max="10" value="3.0" step="0.1" oninput="updateParamsFromSliders()">
                <input type="text" id="inputA" onchange="updateParamsFromInputs()">
            </div>
            
            <div class="group">
                <label style="color: #ffcc00;">Braccio B:</label>
                <input type="range" id="rangeB" min="0" max="10" value="0" step="0.1" oninput="updateParamsFromSliders()">
                <input type="text" id="inputB" onchange="updateParamsFromInputs()">
            </div>

            <div class="group">
                <label style="color: #ff00ff;">Braccio C:</label>
                <input type="range" id="rangeC" min="0" max="10" value="0" step="0.1" oninput="updateParamsFromSliders()">
                <input type="text" id="inputC" onchange="updateParamsFromInputs()">
            </div>

            <div class="group">
                <label style="color: #ff6600;">Braccio D:</label>
                <input type="range" id="rangeD" min="0" max="10" value="0" step="0.1" oninput="updateParamsFromSliders()">
                <input type="text" id="inputD" onchange="updateParamsFromInputs()">
            </div>

            <!-- Frequenze b, c, d -->
            <div class="group divider">
                <label style="color: #ffcc00;">Frequenza b (Braccio B):</label>
                <input type="range" id="rangeFreqB" min="-20" max="20" value="3" step="0.1" oninput="updateParamsFromSliders()">
                <input type="text" id="inputFreqB" onchange="updateParamsFromInputs()">
            </div>

            <div class="group">
                <label style="color: #ff00ff;">Frequenza c (Braccio C):</label>
                <input type="range" id="rangeFreqC" min="-20" max="20" value="-7" step="0.1" oninput="updateParamsFromSliders()">
                <input type="text" id="inputFreqC" onchange="updateParamsFromInputs()">
            </div>

            <div class="group">
                <label style="color: #ff6600;">Frequenza d (Braccio D):</label>
                <input type="range" id="rangeFreqD" min="-20" max="20" value="13" step="0.1" oninput="updateParamsFromSliders()">
                <input type="text" id="inputFreqD" onchange="updateParamsFromInputs()">
            </div>
            
            <div class="group divider">
                <label style="color: #00ff66;">Velocità Tracciatura:</label>
                <input type="range" id="rangeDrawSpeed" min="1" max="40" value="10" oninput="updateDrawSpeedLabel()">
                <span id="valDrawSpeed" class="static-val" style="color: #00ff66;">10</span>
            </div>

            <div class="group">
                <label style="color: #ffaa00;">Variazione cromatica (°):</label>
                <input type="range" id="rangeColorSpeed" min="0" max="180" value="0" oninput="updateColorSpeedLabel()">
                <span id="valColorSpeed" class="static-val" style="color: #ffaa00;">0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spiroCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        const trailCanvas = document.createElement('canvas');
        trailCanvas.width = canvas.width;
        trailCanvas.height = canvas.height;
        const trailCtx = trailCanvas.getContext('2d');

        let A, B, C, D, b, c, d, scale, animationFrameId;
        
        let t = 0;
        let isPaused = false;
        let lastX = null, lastY = null;
        let colorStepAngle = 0; 
        let passoTempo = 0.01; 
        let coloreAttuale = 0;
        let ultimoGiroVettore = 0;

        function parseNumericInput(valStr) {
            if (valStr.includes('/')) {
                let parti = valStr.split('/');
                let num = parseFloat(parti[0]);
                let den = parseFloat(parti[1]);
                if (!isNaN(num) && !isNaN(den) && den !== 0) return num / den;
            }
            return parseFloat(valStr);
        }

        function updateParamsFromSliders() {
            A = parseFloat(document.getElementById('rangeA').value);
            B = parseFloat(document.getElementById('rangeB').value);
            C = parseFloat(document.getElementById('rangeC').value);
            D = parseFloat(document.getElementById('rangeD').value);
            
            b = parseFloat(document.getElementById('rangeFreqB').value);
            c = parseFloat(document.getElementById('rangeFreqC').value);
            d = parseFloat(document.getElementById('rangeFreqD').value);
            
            document.getElementById('inputA').value = A.toFixed(2);
            document.getElementById('inputB').value = B.toFixed(2);
            document.getElementById('inputC').value = C.toFixed(2);
            document.getElementById('inputD').value = D.toFixed(2);
            
            document.getElementById('inputFreqB').value = b.toFixed(2);
            document.getElementById('inputFreqC').value = c.toFixed(2);
            document.getElementById('inputFreqD').value = d.toFixed(2);
            
            applyGeometry();
        }

        function updateParamsFromInputs() {
            let valA = parseNumericInput(document.getElementById('inputA').value);
            let valB = parseNumericInput(document.getElementById('inputB').value);
            let valC = parseNumericInput(document.getElementById('inputC').value);
            let valD = parseNumericInput(document.getElementById('inputD').value);
            
            let valFreqB = parseNumericInput(document.getElementById('inputFreqB').value);
            let valFreqC = parseNumericInput(document.getElementById('inputFreqC').value);
            let valFreqD = parseNumericInput(document.getElementById('inputFreqD').value);

            A = isNaN(valA) ? 0 : valA;
            B = isNaN(valB) ? 0 : valB;
            C = isNaN(valC) ? 0 : valC;
            D = isNaN(valD) ? 0 : valD;
            
            b = isNaN(valFreqB) ? 0 : valFreqB;
            c = isNaN(valFreqC) ? 0 : valFreqC;
            d = isNaN(valFreqD) ? 0 : valFreqD;

            document.getElementById('inputA').value = A.toFixed(2);
            document.getElementById('inputB').value = B.toFixed(2);
            document.getElementById('inputC').value = C.toFixed(2);
            document.getElementById('inputD').value = D.toFixed(2);
            
            document.getElementById('inputFreqB').value = b.toFixed(2);
            document.getElementById('inputFreqC').value = c.toFixed(2);
            document.getElementById('inputFreqD').value = d.toFixed(2);

            document.getElementById('rangeA').value = A;
            document.getElementById('rangeB').value = B;
            document.getElementById('rangeC').value = C;
            document.getElementById('rangeD').value = D;
            
            document.getElementById('rangeFreqB').value = b;
            document.getElementById('rangeFreqC').value = c;
            document.getElementById('rangeFreqD').value = d;

            applyGeometry();
        }

        function applyGeometry() {
            let maxRadius = Math.abs(A) + Math.abs(B) + Math.abs(C) + Math.abs(D);
            scale = maxRadius === 0 ? 1 : (canvas.height / 2 - 25) / maxRadius;
            restartAnimation();
        }

        function updateColorSpeedLabel() {
            colorStepAngle = parseInt(document.getElementById('rangeColorSpeed').value);
            document.getElementById('valColorSpeed').innerText = colorStepAngle;
        }

        function updateDrawSpeedLabel() {
            let speedSliderValue = parseInt(document.getElementById('rangeDrawSpeed').value);
            document.getElementById('valDrawSpeed').innerText = speedSliderValue;
            passoTempo = speedSliderValue * 0.002; 
        }

        function drawStep() {
            if (isPaused) return;

            // z(t) = A*e^(i*t) + B*e^(i*b*t) + C*e^(i*c*t) + D*e^(i*d*t)
            let currentX = A * Math.cos(t) + B * Math.cos(b * t) + C * Math.cos(c * t) + D * Math.cos(d * t);
            let currentY = A * Math.sin(t) + B * Math.sin(b * t) + C * Math.sin(c * t) + D * Math.sin(d * t);
            
            let pNewX = cx + currentX * scale;
            let pNewY = cy + currentY * scale;

            if (lastX !== null && lastY !== null) {
                let giroCorrente = Math.floor(Math.abs(d * t) / (2 * Math.PI));
                
                if (giroCorrente !== ultimoGiroVettore) {
                    coloreAttuale = (coloreAttuale + colorStepAngle) % 360;
                    ultimoGiroVettore = giroCorrente;
                }

                trailCtx.beginPath();
                trailCtx.moveTo(lastX, lastY);
                trailCtx.lineTo(pNewX, pNewY);
                trailCtx.strokeStyle = `hsl(${coloreAttuale}, 100%, 65%)`;
                trailCtx.lineWidth = 1; 
                trailCtx.stroke();
            }

            lastX = pNewX;
            lastY = pNewY;
            t += passoTempo; 

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(trailCanvas, 0, 0); 

            if (document.getElementById('checkShowGeometry').checked) {
                renderGeometry();
            }

            animationFrameId = requestAnimationFrame(drawStep);
        }

        function renderGeometry() {
            // Braccio A (Freq = 1)
            let v1X = cx + A * Math.cos(t) * scale;
            let v1Y = cy + A * Math.sin(t) * scale;

            // Braccio B (Freq = b)
            let v2X = v1X + B * Math.cos(b * t) * scale;
            let v2Y = v1Y + B * Math.sin(b * t) * scale;

            // Braccio C (Freq = c)
            let v3X = v2X + C * Math.cos(c * t) * scale;
            let v3Y = v2Y + C * Math.sin(c * t) * scale;

            ctx.lineWidth = 1.5; 

            // Cerchi guida
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.beginPath(); ctx.arc(cx, cy, Math.abs(A) * scale, 0, 2 * Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.arc(v1X, v1Y, Math.abs(B) * scale, 0, 2 * Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.arc(v2X, v2Y, Math.abs(C) * scale, 0, 2 * Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.arc(v3X, v3Y, Math.abs(D) * scale, 0, 2 * Math.PI); ctx.stroke();

            // 1° Vettore (A) - Azzurro
            ctx.strokeStyle = "#00ffcc";
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(v1X, v1Y); ctx.stroke();

            // 2° Vettore (B) - Giallo
            ctx.strokeStyle = "#ffcc00";
            ctx.beginPath(); ctx.moveTo(v1X, v1Y); ctx.lineTo(v2X, v2Y); ctx.stroke();

            // 3° Vettore (C) - Magenta
            ctx.strokeStyle = "#ff00ff";
            ctx.beginPath(); ctx.moveTo(v2X, v2Y); ctx.lineTo(v3X, v3Y); ctx.stroke();

            // 4° Vettore (D) - Arancione
            ctx.strokeStyle = "#ff6600";
            ctx.beginPath(); ctx.moveTo(v3X, v3Y); ctx.lineTo(lastX, lastY); ctx.stroke();

            // Punto tracciante
            ctx.beginPath();
            ctx.arc(lastX, lastY, 4, 0, 2 * Math.PI); 
            ctx.fillStyle = "#ff1111"; 
            ctx.fill();
            ctx.lineWidth = 1.5; 
            ctx.strokeStyle = "white"; 
            ctx.stroke();
        }

        function updateView() {
            if (isPaused) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(trailCanvas, 0, 0);
                if (document.getElementById('checkShowGeometry').checked) {
                    renderGeometry();
                }
            }
        }

        function togglePause() {
            const btn = document.getElementById('btnPause');
            if (isPaused) {
                isPaused = false;
                btn.innerText = "Pausa";
                drawStep();
            } else {
                isPaused = true;
                btn.innerText = "Riprendi";
                cancelAnimationFrame(animationFrameId);
                updateView(); 
            }
        }

        function restartAnimation() {
            cancelAnimationFrame(animationFrameId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            trailCtx.clearRect(0, 0, canvas.width, canvas.height); 
            t = 0;
            lastX = null;
            lastY = null;
            coloreAttuale = 0;
            ultimoGiroVettore = 0;
            
            if (isPaused) {
                isPaused = false;
                document.getElementById('btnPause').innerText = "Pausa";
            }
            drawStep();
        }

        function randomParam() {
            document.getElementById('rangeA').value = (Math.random() * 4 + 1).toFixed(1);
            document.getElementById('rangeB').value = (Math.random() * 3 + 0.5).toFixed(1);
            document.getElementById('rangeC').value = (Math.random() * 2 + 0.2).toFixed(1);
            document.getElementById('rangeD').value = (Math.random() * 1.5 + 0.1).toFixed(1);
            
            document.getElementById('rangeFreqB').value = ((Math.random() - 0.5) * 15).toFixed(1);
            document.getElementById('rangeFreqC').value = ((Math.random() - 0.5) * 25).toFixed(1);
            document.getElementById('rangeFreqD').value = ((Math.random() - 0.5) * 35).toFixed(1);
            
            updateParamsFromSliders();
        }

        window.onload = function() {
            updateColorSpeedLabel();
            updateDrawSpeedLabel();
            updateParamsFromSliders();
        };
    </script>
</body>
</html>
